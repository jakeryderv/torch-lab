[project]
name = "torch-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
torch-lab = "torch_lab:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
